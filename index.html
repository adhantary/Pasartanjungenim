<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pasar Tanjung Enim</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f3f4f6; padding-bottom: 80px; }
        /* Hilangkan panah naik turun di input number */
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header (Warna Hijau Modern) -->
    <header class="bg-green-700 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
            <div>
                <h1 class="text-xl font-bold tracking-tight">Pasar Tanjung Enim</h1>
                <p class="text-xs text-green-100">Segar & Termurah setiap hari</p>
            </div>
        </div>
    </header>

    <!-- Kontainer Utama -->
    <main class="max-w-md mx-auto p-3">
        <!-- Banner Promo Opsional -->
        <div class="bg-yellow-400 rounded-xl p-3 mb-4 flex items-center justify-between shadow-sm">
            <span class="text-sm font-bold text-green-900">Diskon Ongkir se-Tanjung Enim!</span>
            <span class="bg-white text-green-800 text-xs font-bold px-2 py-1 rounded-full">Klaim</span>
        </div>

        <!-- Katalog Produk (Grid 2 Kolom ala Segari) -->
        <div id="product-list" class="grid grid-cols-2 gap-3">
            <!-- Produk akan di-render di sini oleh JavaScript -->
        </div>
    </main>

    <!-- Sticky Bottom Cart (Muncul jika ada belanjaan) -->
    <div id="bottom-cart" class="fixed bottom-0 left-0 right-0 z-50 hidden slide-up">
        <div class="max-w-md mx-auto bg-white border-t border-gray-200 p-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
            <div class="flex justify-between items-center mb-2">
                <div>
                    <p class="text-xs text-gray-500">Total Belanja (<span id="cart-count">0</span> barang)</p>
                    <p class="text-lg font-bold text-green-700" id="cart-total">Rp 0</p>
                </div>
                <button onclick="checkoutWA()" class="bg-yellow-400 hover:bg-yellow-500 text-green-900 font-bold py-2 px-6 rounded-lg shadow-sm flex items-center gap-2">
                    Beli Sekarang
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let products = [];
        let cart = {}; // Format: { "p001": { product: {...}, qty: 2 } }

        // Format Uang Rupiah
        const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

        // Fetch data produk
        async function fetchProducts() {
            try {
                const response = await fetch('products.json');
                if (!response.ok) throw new Error("Gagal mengambil data");
                products = await response.json();
            } catch (error) {
                console.log("Menggunakan data cadangan karena error fetch:", error);
                // Data cadangan jika JSON gagal dimuat
                products = [
                    { id: "p001", name: "Daging Sapi Segar", price: 125000, unit: "1 Kg", image: "https://placehold.co/400x400/16a34a/FFFFFF?text=Daging", description: "Daging sapi segar" },
                    { id: "p002", name: "Bawang Merah Brebes", price: 35000, unit: "1 Kg", image: "https://placehold.co/400x400/16a34a/FFFFFF?text=Bawang", description: "Bawang merah" }
                ];
            }
            renderProducts();
        }

        // Render Katalog Produk
        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = '';

            products.forEach(p => {
                // Ambil qty saat ini dari cart (jika ada)
                const currentQty = cart[p.id] ? cart[p.id].qty : '';
                
                const card = `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                        <div class="relative">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-36 object-cover">
                            <div class="absolute top-2 left-2 bg-yellow-400 text-green-900 text-[10px] font-bold px-2 py-0.5 rounded">Segar</div>
                        </div>
                        <div class="p-3 flex flex-col flex-grow">
                            <h3 class="text-sm font-semibold text-gray-800 leading-tight mb-1 line-clamp-2">${p.name}</h3>
                            <p class="text-xs text-gray-500 mb-2">/ ${p.unit}</p>
                            <p class="text-green-700 font-bold text-sm mt-auto mb-3">${formatRp(p.price)}</p>
                            
                            <!-- Kontrol Kuantitas (Tombol - Input - Tombol +) -->
                            <div class="flex items-center justify-between border border-green-200 rounded-lg overflow-hidden bg-green-50">
                                <button onclick="updateQty('${p.id}', -1)" class="w-8 h-8 flex items-center justify-center text-green-700 font-bold hover:bg-green-200 transition">-</button>
                                <input type="number" id="qty-${p.id}" 
                                       class="w-full h-8 text-center bg-transparent text-sm font-bold text-green-900 focus:outline-none" 
                                       placeholder="" value="${currentQty}" 
                                       onchange="manualQty('${p.id}', this.value)">
                                <button onclick="updateQty('${p.id}', 1)" class="w-8 h-8 flex items-center justify-center text-green-700 font-bold hover:bg-green-200 transition">+</button>
                            </div>
                        </div>
                    </div>
                `;
                list.innerHTML += card;
            });
        }

        // Fungsi Tambah/Kurang dari tombol (+ / -)
        function updateQty(id, delta) {
            let current = cart[id] ? cart[id].qty : 0;
            let next = current + delta;
            setQty(id, next);
        }

        // Fungsi Ketik Manual di Kolom
        function manualQty(id, value) {
            let next = parseInt(value);
            if (isNaN(next) || next < 0) next = 0;
            setQty(id, next);
        }

        // Fungsi Set Nilai dan Update UI
        function setQty(id, qty) {
            const product = products.find(p => p.id === id);
            
            if (qty <= 0) {
                delete cart[id]; // Hapus dari keranjang jika 0
                document.getElementById(`qty-${id}`).value = ''; // Kosongkan kolom
            } else {
                cart[id] = { product, qty };
                document.getElementById(`qty-${id}`).value = qty; // Isi kolom dengan angka
            }
            
            updateCartUI();
        }

        // Update Tampilan Keranjang Bawah
        function updateCartUI() {
            let totalItem = 0;
            let totalPrice = 0;

            for (let id in cart) {
                totalItem += cart[id].qty;
                totalPrice += (cart[id].qty * cart[id].product.price);
            }

            const bottomCart = document.getElementById('bottom-cart');
            if (totalItem > 0) {
                bottomCart.classList.remove('hidden');
                document.getElementById('cart-count').innerText = totalItem;
                document.getElementById('cart-total').innerText = formatRp(totalPrice);
            } else {
                bottomCart.classList.add('hidden');
            }
        }

        // Fungsi Checkout WhatsApp
        function checkoutWA() {
            if (Object.keys(cart).length === 0) return;

            let pesan = "*Halo Pasar Tanjung Enim, saya mau pesan:*%0A%0A";
            let total = 0;

            for (let id in cart) {
                let item = cart[id];
                let subtotal = item.qty * item.product.price;
                total += subtotal;
                // Format: 2x Daging Sapi Segar (1 Kg) - Rp 250.000
                pesan += `${item.qty}x ${item.product.name} (${item.product.unit}) - ${formatRp(subtotal)}%0A`;
            }

            pesan += `%0A*Total Belanja: ${formatRp(total)}*%0A%0AMohon info ongkir dan pembayarannya ya. Terima kasih!`;
            
            const nomorWA = "6281234567890"; // GANTI DENGAN NOMOR WA ADMIN
            window.open(`https://wa.me/${nomorWA}?text=${pesan}`, "_blank");
        }

        // Jalankan saat pertama kali dibuka
        fetchProducts();
    </script>
</body>
</html>
